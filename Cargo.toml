[workspace]
resolver = "3"
members = ["crates/dolmen-core", "crates/dolmen-cli", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Dolmen contributors"]
repository = "https://github.com/whalebanana86/ai-dolmen"

[workspace.dependencies]
dolmen-core = { path = "crates/dolmen-core" }
clap = { version = "4", features = ["derive", "env"] }

# No debug info in development builds: panics still name their file and line.
# With it, macOS keeps every object file of every rebuild in target/debug/deps
# for the debugger, which grew to tens of gigabytes.
[profile.dev]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
