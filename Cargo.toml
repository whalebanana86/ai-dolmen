[workspace]
resolver = "3"
members = ["crates/dolmen-core", "crates/dolmen-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Dolmen contributors"]
repository = "https://github.com/whalebanana86/ai-dolmen"

[workspace.dependencies]
dolmen-core = { path = "crates/dolmen-core" }
clap = { version = "4", features = ["derive", "env"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
