[package]
name = "dolmen-core"
description = "Dolmen core: database connections, schema introspection and schema versioning"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
futures-util = "0.3"
keyring-core = "1"
native-tls = "0.2"
postgres-native-tls = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-postgres = "0.7"
uuid = { version = "1", features = ["v4"] }

# OS credential stores for saved passwords, as the keyring crate wires them up.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
